[project]
name = "sigtcc-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.126",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-ninja-extra>=0.31.7",
    "django-ninja-jwt>=5.4.5",
    "django-storages>=1.14.6",
    "psycopg[binary]>=3.3.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["integration: needs the real RustFS of the Compose running"]

# Cobertura de linhas e de ramos (#55). `uv run pytest --cov` lê as pastas daqui e falha abaixo de
# `fail_under` no total; `scripts/check_coverage.sh` também exige o mínimo em cada app. Uma falta de
# cobertura vira teste novo, nunca exclusão da medida.
[tool.coverage.run]
branch = true
source = ["apps/accounts", "apps/advising", "apps/meetings"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
